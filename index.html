
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Food | Order Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f7;color:#222;font-family:Arial,sans-serif}
header{background:#171717;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:27px}
header p{margin:7px 0 0;color:#ddd}
main{max-width:750px;margin:auto;padding:16px}
.panel{background:white;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0000000c}
h2{font-size:19px;margin:0 0 14px}
select,input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px;background:white}
.categories{display:flex;gap:8px;overflow-x:auto;margin:14px 0;padding-bottom:5px}
.category{border:1px solid #ddd;background:white;border-radius:20px;padding:10px 16px;white-space:nowrap}
.category.active{background:#171717;color:white;border-color:#171717}
.food{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.food:last-child{border:0}
.food h3{font-size:16px;margin:0 0 6px}
.food p{font-size:13px;color:#777;margin:0 0 8px}
.price{font-weight:bold;color:#168344}
.add{background:#168344;color:white;border:0;padding:10px 17px;border-radius:8px;font-weight:bold}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:30px;height:30px;border:0;border-radius:7px;background:#eee;font-size:18px}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;margin-top:15px}
.place{width:100%;background:#168344;color:white;border:0;border-radius:10px;padding:15px;font-size:17px;font-weight:bold;margin-top:15px}
.place:disabled{opacity:.5}
#message{padding:12px;border-radius:8px;margin:12px 0;display:none;overflow-wrap:anywhere}
.success{background:#e6f7eb;color:#12652c}
.error{background:#ffeded;color:#a40000}
.empty{text-align:center;color:#888;padding:20px}
.small{font-size:12px;color:#888;text-align:center}
</style>
</head>
<body>

<header>
<h1>🍽️ New Food</h1>
<p>Fresh Food • Great Taste</p>
</header>

<main>
<div class="panel">
<h2>Select Your Table</h2>
<select id="table">
<option value="">Choose your table</option>
</select>
</div>

<div class="panel">
<h2>Our Menu</h2>
<div id="categories" class="categories"></div>
<div id="menu"><div class="empty">Loading menu...</div></div>
</div>

<div class="panel">
<h2>🛒 Your Cart</h2>
<div id="cart"><div class="empty">Your cart is empty</div></div>
<div id="total" class="total" style="display:none">
<span>Total</span><span id="totalAmount">₹0</span>
</div>
</div>

<div class="panel">
<h2>Customer Details</h2>
<input id="customerName" maxlength="80" placeholder="Your name (optional)">
<div id="message"></div>
<button class="place" id="placeOrder" disabled>Place Order</button>
<p class="small">Please check your table and order before placing.</p>
</div>
</main>

<script>
const SUPABASE_URL = "https://fjgotlxcgocfcracxazl.supabase.co";
const SUPABASE_KEY = "sb_publishable_HWBcQbyYWpZM2dxLoF0nig_wkg3DdNF";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let restaurantId = null;
let allItems = [];
let cart = {};
let currentCategory = "all";

const menuBox = document.getElementById("menu");
const cartBox = document.getElementById("cart");
const placeButton = document.getElementById("placeOrder");

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}

function showMessage(message,type){
 const box=document.getElementById("message");
 box.textContent=message;
 box.className=type;
 box.style.display="block";
}

function hideMessage(){
 document.getElementById("message").style.display="none";
}

function money(value){
 return "₹"+Number(value).toFixed(2).replace(/\.00$/,"");
}

async function loadMenu(){
 try{
  const restaurantResult=await db
   .from("restaurants")
   .select("id,name")
   .eq("slug","new-food")
   .single();

  if(restaurantResult.error) throw restaurantResult.error;
  restaurantId=restaurantResult.data.id;

  const [categoryResult,itemResult]=await Promise.all([
   db.from("categories")
    .select("id,name,sort_order")
    .eq("restaurant_id",restaurantId)
    .eq("active",true)
    .order("sort_order"),
   db.from("menu_items")
    .select("id,name,description,price,category_id")
    .eq("restaurant_id",restaurantId)
    .eq("available",true)
    .order("name")
  ]);

  if(categoryResult.error) throw categoryResult.error;
  if(itemResult.error) throw itemResult.error;

  allItems=itemResult.data || [];
  renderCategories(categoryResult.data || []);
  renderMenu();
 }catch(error){
  menuBox.innerHTML='<div class="empty">Menu could not load: '+safe(error.message)+'</div>';
 }
}

function renderCategories(categories){
 const box=document.getElementById("categories");
 let html='<button class="category active" data-cat="all">All</button>';

 categories.forEach(cat=>{
  html+='<button class="category" data-cat="'+safe(cat.id)+'">'+safe(cat.name)+'</button>';
 });

 box.innerHTML=html;

 box.querySelectorAll("button").forEach(button=>{
  button.onclick=()=>{
   currentCategory=button.dataset.cat;
   box.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
   button.classList.add("active");
   renderMenu();
  };
 });
}

function renderMenu(){
 const items=currentCategory==="all"
  ?allItems
  :allItems.filter(item=>item.category_id===currentCategory);

 if(!items.length){
  menuBox.innerHTML='<div class="empty">No food items in this category.</div>';
  return;
 }

 menuBox.innerHTML=items.map(item=>`
  <div class="food">
   <div>
    <h3>${safe(item.name)}</h3>
    <p>${safe(item.description || "Freshly prepared for you")}</p>
    <div class="price">${money(item.price)}</div>
   </div>
   <button class="add" data-add="${safe(item.id)}">ADD +</button>
  </div>
 `).join("");

 menuBox.querySelectorAll("[data-add]").forEach(button=>{
  button.onclick=()=>addToCart(button.dataset.add);
 });
}

function addToCart(id){
 const item=allItems.find(x=>x.id===id);
 if(!item)return;
 if(!cart[id])cart[id]={item:item,quantity:0};
 if(cart[id].quantity>=20){
  alert("Maximum 20 quantity allowed.");
  return;
 }
 cart[id].quantity++;
 renderCart();
}

function changeQty(id,change){
 if(!cart[id])return;
 cart[id].quantity+=change;
 if(cart[id].quantity<=0)delete cart[id];
 renderCart();
}

function renderCart(){
 const entries=Object.values(cart);
 let total=0;

 if(!entries.length){
  cartBox.innerHTML='<div class="empty">Your cart is empty</div>';
  document.getElementById("total").style.display="none";
  placeButton.disabled=true;
  return;
 }

 cartBox.innerHTML=entries.map(entry=>{
  const item=entry.item;
  const line=Number(item.price)*entry.quantity;
  total+=line;
  return `
   <div class="cart-row">
    <div>
     <strong>${safe(item.name)}</strong><br>
     <small>${money(item.price)} each</small>
    </div>
    <div class="qty">
     <button data-minus="${safe(item.id)}">−</button>
     <strong>${entry.quantity}</strong>
     <button data-plus="${safe(item.id)}">+</button>
    </div>
    <strong>${money(line)}</strong>
   </div>
  `;
 }).join("");

 cartBox.querySelectorAll("[data-minus]").forEach(b=>{
  b.onclick=()=>changeQty(b.dataset.minus,-1);
 });
 cartBox.querySelectorAll("[data-plus]").forEach(b=>{
  b.onclick=()=>changeQty(b.dataset.plus,1);
 });

 document.getElementById("totalAmount").textContent=money(total);
 document.getElementById("total").style.display="flex";
 placeButton.disabled=false;
}

function setupTables(){
 const select=document.getElementById("table");
 for(let i=1;i<=10;i++){
  const option=document.createElement("option");
  option.value=i;
  option.textContent="Table "+i;
  select.appendChild(option);
 }
}

placeButton.onclick=async function(){
 hideMessage();

 const tableNumber=Number(document.getElementById("table").value);
 const customerName=document.getElementById("customerName").value.trim();
 const entries=Object.values(cart);

 if(!tableNumber){
  showMessage("Please select your table number.","error");
  return;
 }
 if(!entries.length){
  showMessage("Please add food to your cart.","error");
  return;
 }

 const items=entries.map(entry=>({
  menu_item_id:entry.item.id,
  quantity:entry.quantity
 }));

 placeButton.disabled=true;
 placeButton.textContent="Placing order...";

 try{
  const {data,error}=await db.rpc("place_new_food_order",{
   p_table_number:tableNumber,
   p_customer_name:customerName,
   p_items:items
  });

  if(error)throw error;
  if(!data || !data.success)throw new Error("Order was not confirmed.");

  cart={};
  renderCart();
  document.getElementById("table").value="";
  document.getElementById("customerName").value="";

  showMessage(
   "Order placed successfully! Order ID: "+data.order_id+
   " | Total: "+money(data.total),
   "success"
  );
 }catch(error){
  showMessage("Order failed: "+error.message,"error");
 }finally{
  placeButton.textContent="Place Order";
  placeButton.disabled=Object.keys(cart).length===0;
 }
};

setupTables();
loadMenu();
</script>
</body>
</html>
